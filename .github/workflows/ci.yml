name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cherry
          POSTGRES_PASSWORD: cherry
          POSTGRES_DB: cherry_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cherry -d cherry_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://cherry:cherry@localhost:5432/cherry_ci
      JWT_SECRET: ci-only-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: find src -name "*.js" -exec node --check {} +

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Seed database
        run: node src/database/seed.js

      - name: Run tests
        run: npm test -- --runInBand

      - name: Quality gate summary
        run: |
          echo "Backend quality gate passed."
          echo "Required checks: install, syntax, database bootstrap, seed and tests."
